[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-ci-demo"
version = "1.2.9"
description = "Calculator demo for CI, artifacts, and AWS deployment"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22,<23",
]

[tool.setuptools.packages.find]
include = ["app*"]
